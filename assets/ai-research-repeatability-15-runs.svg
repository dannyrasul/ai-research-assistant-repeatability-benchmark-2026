<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One prompt, three runs, five AI research tools</title>
  <desc id="desc">Summary of 15 run-level observations recorded on 1 August 2026 for ResearchRabbit, Elicit, Scite, Consensus and Undermind.</desc>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <rect width="1600" height="176" fill="#0f172a"/>
  <text x="76" y="70" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="2" fill="#5eead4">AI NEWS &amp; UPDATES · OPEN BENCHMARK</text>
  <text x="76" y="122" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">One prompt. Three runs. Five AI research tools.</text>
  <text x="76" y="158" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#cbd5e1">15 run-level observations · tested 1 August 2026 · free or limited-access modes</text>

  <g transform="translate(60 210)">
    <rect width="470" height="270" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="10" height="270" rx="5" fill="#2563eb"/>
    <text x="34" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0f172a">ResearchRabbit</text>
