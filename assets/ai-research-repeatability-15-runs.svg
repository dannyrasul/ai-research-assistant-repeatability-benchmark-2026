    <text x="34" y="128" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2563eb">18,800</text>
    <text x="153" y="127" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#94a3b8">→</text>
    <text x="193" y="128" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2563eb">2,390</text>
    <text x="292" y="127" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#94a3b8">→</text>
    <text x="332" y="128" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#2563eb">18,900</text>
    <rect x="34" y="155" width="388" height="12" rx="6" fill="#dbeafe"/>
    <rect x="34" y="155" width="386" height="12" rx="6" fill="#2563eb"/>
    <rect x="34" y="178" width="388" height="12" rx="6" fill="#dbeafe"/>
    <rect x="34" y="178" width="49" height="12" rx="6" fill="#2563eb"/>
    <rect x="34" y="201" width="388" height="12" rx="6" fill="#dbeafe"/>
    <rect x="34" y="201" width="388" height="12" rx="6" fill="#2563eb"/>
    <text x="34" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Same keywords; large count and ranking swing.</text>
  </g>

  <g transform="translate(565 210)">
    <rect width="470" height="270" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="10" height="270" rx="5" fill="#7c3aed"/>
