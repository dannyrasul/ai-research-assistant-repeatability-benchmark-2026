  <line x1="60" y1="808" x2="1540" y2="808" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="842" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Interpretation:</text>
  <text x="190" y="842" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#334155">one dated question, small sample, specific account conditions; missing values are not zero.</text>
  <text x="60" y="875" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f766e">Method, data and reuse:</text>
  <text x="278" y="875" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#0f172a">ainewsandupdates.com/how-to-test-ai-research-tools/</text>
