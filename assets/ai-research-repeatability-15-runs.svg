    <text x="286" y="154" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">sampled claim-to-source checks</text>
    <text x="34" y="210" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Most consistent repeated-search pattern in this limited sample—not a universal accuracy ranking.</text>
  </g>

  <g transform="translate(815 515)">
    <rect width="725" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="10" height="250" rx="5" fill="#ea580c"/>
    <text x="34" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Undermind</text>
    <text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Reported papers / full texts</text>
    <g transform="translate(34 112)" font-family="Arial, Helvetica, sans-serif">
      <text x="0" y="28" font-size="18" font-weight="700" fill="#334155">Run 1</text>
      <text x="100" y="28" font-size="31" font-weight="700" fill="#ea580c">82</text>
      <text x="158" y="28" font-size="18" fill="#64748b">papers</text>
      <text x="270" y="28" font-size="31" font-weight="700" fill="#0f172a">21</text>
      <text x="326" y="28" font-size="18" fill="#64748b">full texts</text>
      <text x="0" y="72" font-size="18" font-weight="700" fill="#334155">Run 2</text>
      <text x="100" y="72" font-size="31" font-weight="700" fill="#ea580c">90</text>
      <text x="158" y="72" font-size="18" fill="#64748b">papers</text>
      <text x="270" y="72" font-size="31" font-weight="700" fill="#0f172a">27</text>
      <text x="326" y="72" font-size="18" fill="#64748b">full texts</text>
      <text x="0" y="116" font-size="18" font-weight="700" fill="#334155">Run 3</text>
      <text x="100" y="116" font-size="31" font-weight="700" fill="#ea580c">84</text>
      <text x="158" y="116" font-size="18" fill="#64748b">papers</text>
      <text x="270" y="116" font-size="31" font-weight="700" fill="#0f172a">24</text>
      <text x="326" y="116" font-size="18" fill="#64748b">full texts</text>
    </g>
