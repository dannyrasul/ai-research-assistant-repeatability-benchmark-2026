      <path d="M14 24l7 7 14-16" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="10" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Run 1</text>
      <circle cx="150" cy="24" r="24" fill="#dcfce7"/>
      <path d="M140 24l7 7 14-16" fill="none" stroke="#15803d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="136" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Run 2</text>
      <circle cx="276" cy="24" r="24" fill="#fef3c7"/>
      <path d="M276 10v20M276 39v1" fill="none" stroke="#b45309" stroke-width="5" stroke-linecap="round"/>
      <text x="262" y="70" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">Run 3</text>
    </g>
    <text x="34" y="218" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Two complete; third interrupted after the</text>
    <text x="34" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">monthly free allowance was exhausted.</text>
  </g>

  <g transform="translate(1070 210)">
    <rect width="470" height="270" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="10" height="270" rx="5" fill="#dc2626"/>
    <text x="34" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Scite</text>
    <text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">What happened across three runs</text>
    <rect x="34" y="106" width="106" height="42" rx="9" fill="#fef3c7"/>
    <text x="54" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#92400e">PARTIAL</text>
    <rect x="156" y="106" width="126" height="42" rx="9" fill="#fee2e2"/>
    <text x="175" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#991b1b">OFF-TOPIC</text>
    <rect x="298" y="106" width="112" height="42" rx="9" fill="#e2e8f0"/>
    <text x="318" y="134" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">BLOCKED</text>
    <text x="34" y="184" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Run 1: only 1 of 13 reported references</text>
    <text x="34" y="208" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">was accessible without upgrading.</text>
    <text x="34" y="242" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#334155">Run 2 returned two unrelated oncology papers.</text>
  </g>

  <g transform="translate(60 515)">
    <rect width="720" height="250" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect width="10" height="250" rx="5" fill="#059669"/>
    <text x="34" y="48" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Consensus</text>
    <text x="34" y="82" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Three complete runs</text>
    <g transform="translate(34 108)">
      <circle cx="28" cy="28" r="28" fill="#d1fae5"/>
      <path d="M16 28l8 8 17-20" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="112" cy="28" r="28" fill="#d1fae5"/>
      <path d="M100 28l8 8 17-20" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="196" cy="28" r="28" fill="#d1fae5"/>
      <path d="M184 28l8 8 17-20" fill="none" stroke="#047857" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
